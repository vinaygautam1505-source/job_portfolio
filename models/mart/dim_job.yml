version: 2

models:
  - name: dim_job_details
    description: "job dimenssion table"

     columns:
      - name: INDEX_COL
        description: "each job's unique serial number"
        tests:
          - not_null
          - unique

      - name: JOB_TITLE
        description: "post's designation name"
        tests:
          - not_null

      - name: SALARY_ESTIMATE
        description: "jobs salary expectation range"
        tests:
          - not_null
  
