version: 2

models:
  - name: dim_job_details
    description: "job dimenssion table"

    columns:
      - name: JOB_TITLE_ID
        description: "each job's unique serial number"
        tests:
          - not_null
          - unique

      - name: JOB_TITLE
        description: "post's designation name"
        tests:
          - not_null

      - name: COMPANY_NAME
        description: "company offering the job vacancy"
        tests:
          - not_null
          
      - name: SALARY_ESTIMATE
        description: "jobs salary expectation range"
        tests:
          - not_null

      - name: JOB_DESCRIPTION
        description: "job's brief description"
        tests:
          - not_null
  
