version: 2

models:
  - name: dim_job_details
    description: "job dimenssion table"

    columns:
      - name: COMPANY_NAME
        description: "company offering the job vacancy"
        tests:
          - not_null

      - name: COMPANY_LOCATION
        description: "company location details"
        tests:
          - not_null

      - name: COMPANY_HEADQUARTERS
        description: "company's headquarter location"
        tests:
          - not_null

      - name: COMPANY_SIZE
        description: "approximate number of employees"
        tests:
          - not_null

      - name: COMPANY_FOUNDED
        description: "company's establishment year"
        tests:
          - not_null

      - name: OWNERSHIP_TYPE
        description: "company's ownership details"
        tests:
          - not_null

      - name: INDUSTRY
        description: "company belongs to which industry"
        tests:
          - not_null

      - name: SECTOR
        description: "company working in sector"
        tests:
          - not_null

      - name: APPROX_REVENUE
        description: "company's total approximate revenue"
        tests:
          - not_null

      - name: COMPETITORS
        description: "company's competitors details"
        tests:
          - not_null




          
         
         
